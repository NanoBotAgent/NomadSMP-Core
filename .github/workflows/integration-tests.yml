name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download WorldEdit dependency
        run: |
          mkdir -p libs
          curl -sL "https://cdn.modrinth.com/data/1u6JkXh5/versions/k9KdTr1M/worldedit-bukkit-7.4.3-beta-01.jar" -o libs/worldedit-bukkit-7.4.3-beta-01.jar
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: NomadSMP-Core
          path: build/libs/*.jar
          retention-days: 7

  # ─── Smoke Test: Plugin loads without errors ───
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Paper 26.1.2
        run: |
          curl -sL "https://fill-data.papermc.io/v1/objects/6934188878fc351e1be5bfba5f2b8c4591224886e4b34e3de09dbec68a351caf/paper-26.1.2-53.jar" -o paper.jar
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: NomadSMP-Core
          path: plugins/
      - name: Download WorldEdit
        run: |
          mkdir -p plugins
          curl -sL "https://cdn.modrinth.com/data/1u6JkXh5/versions/k9KdTr1M/worldedit-bukkit-7.4.3-beta-01.jar" -o plugins/worldedit-bukkit-7.4.3-beta-01.jar
      - name: Setup server
        run: |
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25575" >> server.properties
          echo "rcon.password=testpass" >> server.properties
      - name: Start Paper and verify plugin loads
        timeout-minutes: 5
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx512M -Xms512M \
            -jar paper.jar --nogui --max-players=5 &
          SERVER_PID=$!
          TIMEOUT=120 ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started successfully!"
              if grep -q "NomadSMP-Core enabled" logs/latest.log 2>/dev/null; then
                echo "PASS: NomadSMP-Core plugin loaded"
              else
                echo "WARN: NomadSMP-Core not explicitly enabled — checking for errors"
                grep -i "NomadSMP" logs/latest.log | head -10
              fi
              if grep -qi "SEVERE\|FATAL\|Could not load\|UnsupportedClassVersion" logs/latest.log 2>/dev/null; then
                echo "FAIL: Severe errors detected"
                grep -i "SEVERE\|FATAL\|Could not load" logs/latest.log | head -20
                kill $SERVER_PID 2>/dev/null || true
                wait $SERVER_PID 2>/dev/null || true
                exit 1
              fi
              echo "PASS: No severe startup errors"
              cp logs/latest.log logs/smoke-test.log 2>/dev/null || true
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
              echo "FAIL: Server failed to start"
              tail -50 logs/latest.log
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "FAIL: Server did not start within ${TIMEOUT}s"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  # ─── RCON Command Test: /nomad commands work correctly ───
  rcon-commands:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Paper 26.1.2
        run: |
          curl -sL "https://fill-data.papermc.io/v1/objects/6934188878fc351e1be5bfba5f2b8c4591224886e4b34e3de09dbec68a351caf/paper-26.1.2-53.jar" -o paper.jar
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: NomadSMP-Core
          path: plugins/
      - name: Download WorldEdit
        run: |
          mkdir -p plugins
          curl -sL "https://cdn.modrinth.com/data/1u6JkXh5/versions/k9KdTr1M/worldedit-bukkit-7.4.3-beta-01.jar" -o plugins/worldedit-bukkit-7.4.3-beta-01.jar
      - name: Setup server
        run: |
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25575" >> server.properties
          echo "rcon.password=testpass" >> server.properties
      - name: Write Python RCON helper
        run: |
          cat > rcon.py << 'RCEOF'
          import struct, socket, sys
          def rcon(host, port, password, command):
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(10)
              s.connect((host, port))
              def send(id, type, body):
                  payload = struct.pack('<ii', id, type) + body.encode() + b'\x00\x00'
                  s.sendall(struct.pack('<i', len(payload)) + payload)
              def recv():
                  d = b''
                  while len(d) < 4: d += s.recv(4 - len(d))
                  l = struct.unpack('<i', d)[0]
                  p = b''
                  while len(p) < l: p += s.recv(l - len(p))
                  return struct.unpack('<ii', p[:8])[0], p[8:-2].decode('utf-8', errors='replace')
              send(1, 3, password)
              rid, _ = recv()
              if rid == -1: sys.exit('RCON auth failed')
              send(2, 2, command)
              _, body = recv()
              s.close()
              return body
          if __name__ == '__main__':
              host, port, pw = sys.argv[1], int(sys.argv[2]), sys.argv[3]
              cmd = ' '.join(sys.argv[4:])
              print(rcon(host, port, pw, cmd))
          RCEOF
      - name: Start Paper server
        timeout-minutes: 5
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx512M -Xms512M \
            -jar paper.jar --nogui --max-players=5 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started!"
              break
            fi
            sleep 2
          done
          sleep 3

          # ── Test /nomad status ──
          echo "=== Test: /nomad status ==="
          RESULT=$(python3 rcon.py localhost 25575 testpass "nomad status" 2>/dev/null)
          echo "Result: $RESULT"
          if echo "$RESULT" | grep -qi "nomad\|buff\|enabled"; then
            echo "PASS: /nomad status responds"
          else
            echo "WARN: /nomad status may not have responded properly"
          fi

          # ── Test /nomad setbuff 14 (Timber) ──
          echo "=== Test: /nomad setbuff 14 ==="
          RESULT=$(python3 rcon.py localhost 25575 testpass "nomad setbuff 14" 2>/dev/null)
          echo "Result: $RESULT"
          if echo "$RESULT" | grep -qi "timber\|buff"; then
            echo "PASS: /nomad setbuff 14 accepted"
          else
            echo "WARN: setbuff 14 may not have responded"
          fi
          sleep 1

          # ── Test /nomad setbuff 40 (Teleporter) ──
          echo "=== Test: /nomad setbuff 40 ==="
          RESULT=$(python3 rcon.py localhost 25575 testpass "nomad setbuff 40" 2>/dev/null)
          echo "Result: $RESULT"

          # ── Test /nomad setbuff 51 (Leaf Cut) ──
          echo "=== Test: /nomad setbuff 51 ==="
          RESULT=$(python3 rcon.py localhost 25575 testpass "nomad setbuff 51" 2>/dev/null)
          echo "Result: $RESULT"
          if echo "$RESULT" | grep -qi "leaf\|buff\|51"; then
            echo "PASS: /nomad setbuff 51 (Leaf Cut) accepted"
          else
            echo "WARN: setbuff 51 may not have responded properly"
          fi
          sleep 1

          # ── Test /nomad setbuff 2 7 (multi-buff) ──
          echo "=== Test: /nomad setbuff 2 7 ==="
          RESULT=$(python3 rcon.py localhost 25575 testpass "nomad setbuff 2 7" 2>/dev/null)
          echo "Result: $RESULT"

          # ── Test /nomad setbuff (clear all) ──
          echo "=== Test: /nomad setbuff (no args = clear) ==="
          RESULT=$(python3 rcon.py localhost 25575 testpass "nomad setbuff" 2>/dev/null)
          echo "Result: $RESULT"

          # ── Test /nomad reload ──
          echo "=== Test: /nomad reload ==="
          RESULT=$(python3 rcon.py localhost 25575 testpass "nomad reload" 2>/dev/null)
          echo "Result: $RESULT"

          # ── Check no exceptions thrown during buff operations ──
          echo "=== Exception check ==="
          EXCEPTIONS=$(grep -i "exception\|error" logs/latest.log 2>/dev/null | \
            grep -vi "PLEASE RESTART\|Vault\|NoVault\|Economy\|java.lang.Class" | head -10)
          if [ -z "$EXCEPTIONS" ]; then
            echo "PASS: No unexpected exceptions in log"
          else
            echo "WARN: Exceptions found:"
            echo "$EXCEPTIONS"
          fi

          cp logs/latest.log logs/rcon-commands.log 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

  # ─── Buff Rollover Test: Verify old effects stripped on join ───
  buff-rollover:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Paper 26.1.2
        run: |
          curl -sL "https://fill-data.papermc.io/v1/objects/6934188878fc351e1be5bfba5f2b8c4591224886e4b34e3de09dbec68a351caf/paper-26.1.2-53.jar" -o paper.jar
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: NomadSMP-Core
          path: plugins/
      - name: Download WorldEdit
        run: |
          mkdir -p plugins
          curl -sL "https://cdn.modrinth.com/data/1u6JkXh5/versions/k9KdTr1M/worldedit-bukkit-7.4.3-beta-01.jar" -o plugins/worldedit-bukkit-7.4.3-beta-01.jar
      - name: Setup server
        run: |
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25575" >> server.properties
          echo "rcon.password=testpass" >> server.properties
      - name: Write Python RCON helper
        run: |
          cat > rcon.py << 'RCEOF'
          import struct, socket, sys
          def rcon(host, port, password, command):
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(10)
              s.connect((host, port))
              def send(id, type, body):
                  payload = struct.pack('<ii', id, type) + body.encode() + b'\x00\x00'
                  s.sendall(struct.pack('<i', len(payload)) + payload)
              def recv():
                  d = b''
                  while len(d) < 4: d += s.recv(4 - len(d))
                  l = struct.unpack('<i', d)[0]
                  p = b''
                  while len(p) < l: p += s.recv(l - len(p))
                  return struct.unpack('<ii', p[:8])[0], p[8:-2].decode('utf-8', errors='replace')
              send(1, 3, password)
              rid, _ = recv()
              if rid == -1: sys.exit('RCON auth failed')
              send(2, 2, command)
              _, body = recv()
              s.close()
              return body
          if __name__ == '__main__':
              host, port, pw = sys.argv[1], int(sys.argv[2]), sys.argv[3]
              cmd = ' '.join(sys.argv[4:])
              print(rcon(host, port, pw, cmd))
          RCEOF
      - name: Test buff switching clears old effects
        timeout-minutes: 5
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx512M -Xms512M \
            -jar paper.jar --nogui --max-players=5 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started!"
              break
            fi
            sleep 2
          done
          sleep 3

          # Step 1: Set buff to Power Miner (2 = Haste)
          echo "=== Step 1: Apply Power Miner (Haste) ==="
          python3 rcon.py localhost 25575 testpass "nomad setbuff 2" 2>/dev/null
          sleep 2

          # Step 2: Switch to Night Owl (7 = Night Vision) — should strip Haste first
          echo "=== Step 2: Switch to Night Owl — should strip Haste ==="
          python3 rcon.py localhost 25575 testpass "nomad setbuff 7" 2>/dev/null
          sleep 2

          # Step 3: Apply both — should work cleanly without stacking
          echo "=== Step 3: Apply both buffs ==="
          python3 rcon.py localhost 25575 testpass "nomad setbuff 2 7" 2>/dev/null
          sleep 2

          # Step 4: Clear all buffs — should remove everything
          echo "=== Step 4: Clear all buffs ==="
          python3 rcon.py localhost 25575 testpass "nomad setbuff" 2>/dev/null
          sleep 2

          # Check for errors during buff switching
          echo "=== Checking for errors during buff operations ==="
          BUFF_ERRORS=$(grep -i "exception\|error\|null" logs/latest.log 2>/dev/null | \
            grep -vi "PLEASE RESTART\|Vault\|NoVault\|Economy\|java.lang.Class\|StatsManager" | \
            grep -i "buff\|apply\|remove\|nomad" | head -10)
          if [ -z "$BUFF_ERRORS" ]; then
            echo "PASS: No errors during buff switching"
          else
            echo "FAIL: Errors found during buff switching:"
            echo "$BUFF_ERRORS"
            cp logs/latest.log logs/buff-rollover.log 2>/dev/null || true
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          cp logs/latest.log logs/buff-rollover.log 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

  # ─── New Buff Registration Test: All 51 buffs load properly ───
  buff-registration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Paper 26.1.2
        run: |
          curl -sL "https://fill-data.papermc.io/v1/objects/6934188878fc351e1be5bfba5f2b8c4591224886e4b34e3de09dbec68a351caf/paper-26.1.2-53.jar" -o paper.jar
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: NomadSMP-Core
          path: plugins/
      - name: Download WorldEdit
        run: |
          mkdir -p plugins
          curl -sL "https://cdn.modrinth.com/data/1u6JkXh5/versions/k9KdTr1M/worldedit-bukkit-7.4.3-beta-01.jar" -o plugins/worldedit-bukkit-7.4.3-beta-01.jar
      - name: Setup server
        run: |
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25575" >> server.properties
          echo "rcon.password=testpass" >> server.properties
      - name: Write Python RCON helper
        run: |
          cat > rcon.py << 'RCEOF'
          import struct, socket, sys
          def rcon(host, port, password, command):
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(10)
              s.connect((host, port))
              def send(id, type, body):
                  payload = struct.pack('<ii', id, type) + body.encode() + b'\x00\x00'
                  s.sendall(struct.pack('<i', len(payload)) + payload)
              def recv():
                  d = b''
                  while len(d) < 4: d += s.recv(4 - len(d))
                  l = struct.unpack('<i', d)[0]
                  p = b''
                  while len(p) < l: p += s.recv(l - len(p))
                  return struct.unpack('<ii', p[:8])[0], p[8:-2].decode('utf-8', errors='replace')
              send(1, 3, password)
              rid, _ = recv()
              if rid == -1: sys.exit('RCON auth failed')
              send(2, 2, command)
              _, body = recv()
              s.close()
              return body
          if __name__ == '__main__':
              host, port, pw = sys.argv[1], int(sys.argv[2]), sys.argv[3]
              cmd = ' '.join(sys.argv[4:])
              print(rcon(host, port, pw, cmd))
          RCEOF
      - name: Test all 51 buffs can be set
        timeout-minutes: 8
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx512M -Xms512M \
            -jar paper.jar --nogui --max-players=5 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started!"
              break
            fi
            sleep 2
          done
          sleep 3

          FAIL_COUNT=0
          for id in $(seq 1 51); do
            RESULT=$(python3 rcon.py localhost 25575 testpass "nomad setbuff $id" 2>/dev/null)
            CLEAN=$(echo "$RESULT" | sed 's/\x1b\[[0-9;]*m//g' | sed 's/§[0-9a-fk-or]//gi')
            if echo "$CLEAN" | grep -qi "unknown\|error\|invalid\|not found"; then
              echo "FAIL: Buff $id not recognized"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            else
              echo "OK: Buff $id accepted"
            fi
            sleep 1
          done

          echo ""
          echo "=== Results: $((51 - FAIL_COUNT))/51 buffs registered ==="

          if grep -q "ArrayIndexOutOfBounds" logs/latest.log 2>/dev/null; then
            echo "FAIL: ArrayIndexOutOfBoundsException found — buff arrays may be misaligned"
            grep "ArrayIndexOutOfBounds" logs/latest.log | head -5
            cp logs/latest.log logs/buff-registration.log 2>/dev/null || true
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          if [ $FAIL_COUNT -gt 0 ]; then
            echo "FAIL: $FAIL_COUNT buffs not recognized"
            cp logs/latest.log logs/buff-registration.log 2>/dev/null || true
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "PASS: All 51 buffs registered and accessible"
          cp logs/latest.log logs/buff-registration.log 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

  # ─── Exception Scan: No errors in server log after plugin operations ───
  exception-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Paper 26.1.2
        run: |
          curl -sL "https://fill-data.papermc.io/v1/objects/6934188878fc351e1be5bfba5f2b8c4591224886e4b34e3de09dbec68a351caf/paper-26.1.2-53.jar" -o paper.jar
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: NomadSMP-Core
          path: plugins/
      - name: Download WorldEdit
        run: |
          mkdir -p plugins
          curl -sL "https://cdn.modrinth.com/data/1u6JkXh5/versions/k9KdTr1M/worldedit-bukkit-7.4.3-beta-01.jar" -o plugins/worldedit-bukkit-7.4.3-beta-01.jar
      - name: Setup server
        run: |
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25575" >> server.properties
          echo "rcon.password=testpass" >> server.properties
      - name: Write Python RCON helper
        run: |
          cat > rcon.py << 'RCEOF'
          import struct, socket, sys
          def rcon(host, port, password, command):
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(10)
              s.connect((host, port))
              def send(id, type, body):
                  payload = struct.pack('<ii', id, type) + body.encode() + b'\x00\x00'
                  s.sendall(struct.pack('<i', len(payload)) + payload)
              def recv():
                  d = b''
                  while len(d) < 4: d += s.recv(4 - len(d))
                  l = struct.unpack('<i', d)[0]
                  p = b''
                  while len(p) < l: p += s.recv(l - len(p))
                  return struct.unpack('<ii', p[:8])[0], p[8:-2].decode('utf-8', errors='replace')
              send(1, 3, password)
              rid, _ = recv()
              if rid == -1: sys.exit('RCON auth failed')
              send(2, 2, command)
              _, body = recv()
              s.close()
              return body
          if __name__ == '__main__':
              host, port, pw = sys.argv[1], int(sys.argv[2]), sys.argv[3]
              cmd = ' '.join(sys.argv[4:])
              print(rcon(host, port, pw, cmd))
          RCEOF
      - name: Full plugin exercise + exception scan
        timeout-minutes: 5
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx512M -Xms512M \
            -jar paper.jar --nogui --max-players=5 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started!"
              break
            fi
            sleep 2
          done
          sleep 3

          # Exercise the plugin thoroughly
          python3 rcon.py localhost 25575 testpass "nomad status" 2>/dev/null
          sleep 1
          python3 rcon.py localhost 25575 testpass "nomad setbuff 14 40 51" 2>/dev/null
          sleep 2
          python3 rcon.py localhost 25575 testpass "nomad reload" 2>/dev/null
          sleep 3
          python3 rcon.py localhost 25575 testpass "nomad setbuff" 2>/dev/null
          sleep 2
          python3 rcon.py localhost 25575 testpass "nomad status" 2>/dev/null
          sleep 1

          # Scan for NomadSMP-related exceptions
          echo "=== Scanning for NomadSMP-related exceptions ==="
          NOMAD_ERRORS=$(grep -i "nomad" logs/latest.log 2>/dev/null | \
            grep -iv "enabled\|disabled\|loaded\|Daily\|broadcast\|buff\|reload\|config\|started" | head -20)
          if [ -z "$NOMAD_ERRORS" ]; then
            echo "PASS: No NomadSMP-related exceptions found"
          else
            echo "WARN: Unexpected NomadSMP log entries:"
            echo "$NOMAD_ERRORS"
          fi

          # Scan for any stack traces from our plugin
          echo "=== Scanning for stack traces ==="
          TRACES=$(grep -A5 "com.nomadsmp" logs/latest.log 2>/dev/null | \
            grep -iv "enabled\|loaded\|Daily\|broadcast\|INFO" | head -30)
          if [ -z "$TRACES" ]; then
            echo "PASS: No stack traces from NomadSMP code"
          else
            echo "FAIL: Stack traces found:"
            echo "$TRACES"
            cp logs/latest.log logs/exception-scan.log 2>/dev/null || true
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          cp logs/latest.log logs/exception-scan.log 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

  # ─── Upload all logs ───
  upload-logs:
    needs: [smoke-test, rcon-commands, buff-rollover, buff-registration, exception-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all log artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-log-*"
          merge-multiple: true
        continue-on-error: true
