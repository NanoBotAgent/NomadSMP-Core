name: Build Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Download WorldEdit dependency
      run: |
        mkdir -p libs
        curl -sL "https://cdn.modrinth.com/data/1u6JkXh5/versions/k9KdTr1M/worldedit-bukkit-7.4.3-beta-01.jar" -o libs/worldedit-bukkit-7.4.3-beta-01.jar
        ls -lh libs/
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: chmod +x gradlew && ./gradlew shadowJar
    - name: Upload plugin JAR
      uses: actions/upload-artifact@v4
      with:
        name: NomadSMP-Core
        path: build/libs/*.jar
        retention-days: 30
