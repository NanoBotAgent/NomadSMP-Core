# ─────────────────────────────────────────────
# NomadSMP-Core Configuration
# /nomad reload to apply changes without restart
# ─────────────────────────────────────────────

nomad-system:
  enabled: true
  migrate-day: MONDAY
  migrate-hour: 0                # 24h clock (0 = midnight)
  house-radius: 16               # Half-width of the schematic box saved per player
  safe-land-check: true          # Abort paste if Y < 60 or over liquid

daily-buffs:
  enabled: true
  broadcast-on-join: true
  broadcast-color: "\u00a76"     # Color code for broadcast messages

  # Each day can have one of three modes:
  #   fixed   — always use the buff IDs listed in "buffs"
  #   random  — pick from "pool" using the date as seed (same buff all day)
  #   off     — no buff on this day
  monday:
    mode: fixed
    buffs: [2]                   # Power Miner
    pool: []                     # Only used when mode is random
  tuesday:
    mode: fixed
    buffs: [3]                   # Roadrunner
    pool: []
  wednesday:
    mode: fixed
    buffs: [1]                   # Titanium
    pool: []
  thursday:
    mode: fixed
    buffs: [2]                   # Power Miner
    pool: []
  friday:
    mode: fixed
    buffs: [3]                   # Roadrunner
    pool: []
  saturday:
    mode: random
    buffs: []
    pool: [1, 2, 3, 4, 5, 6, 7, 8]
  sunday:
    mode: random
    buffs: []
    pool: [1, 2, 3, 4, 5, 6, 7, 8]

  # How many buffs to pick when mode is random (1 = single buff, 2 = two buffs, etc.)
  random-count: 1

progression-lock:
  enabled: true
  end-locked: true
  end-unlock-days: 30            # Days since server-start-date before End portal activates
  server-start-date: "2025-01-01" # ISO date (YYYY-MM-DD)
  netherite-crafting-banned: true
  netherite-equip-punish: true   # Slowness V for 5s if Netherite armor is worn
  block-gamemode-command: true   # Block /gamemode, /give, /op for everyone
  block-give-command: true

anti-cheat:
  enabled: true
  block-seed-command: true
  scramble-structure-seeds: true
  ore-obfuscation: true

social:
  enabled: true
  world-border:
    enabled: true
    size: 500                    # Total diameter (500 = 500x500 world border)
    center-x: 0                  # Center X coordinate
    center-z: 0                  # Center Z coordinate
    damage-amount: 0.5           # Damage per tick outside border
    warning-distance: 10         # Blocks inside border to show warning
  disable-tpa: true
  disable-warp: true
  disable-home-command: true     # /home and /sethome are blocked
  player-head-drop: true         # 100% chance on PvP kill
  no-admin-op: true              # Strips OP from all players on startup

