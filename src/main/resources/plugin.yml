name: NomadSMP-Core
version: 1.0.2
main: com.nomadsmp.core.NomadCore
api-version: "26.1"
description: Nomad SMP core plugin with daily buffs, progression lock, anti-cheat, and social features
authors: [APPLEPIE6969]
website: https://github.com/NanoBotAgent/NomadSMP-Core

commands:
  nomad:
    description: Main NomadSMP command
    usage: /nomad <status|setbuff|reload>
    permission: nomad.admin

permissions:
  nomad.admin:
    description: Access to all NomadSMP admin commands
    default: op

