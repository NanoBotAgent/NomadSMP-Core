name: NomadSMP-Core
version: 1.0.0
main: com.nomadsmp.core.NomadCore
api-version: "26.1"
depend: [WorldEdit]
commands:
  nomad:
    description: Admin command for NomadSMP-Core
    permission: nomad.admin
    usage: /nomad <reload|status|stats|buffs|setbuff|setbuffpool|setborder|migratenow|sethome>
    tab-completer: com.nomadsmp.core.commands.NomadCommand
permissions:
  nomad.admin:
    description: Full admin access to NomadSMP commands
    default: op